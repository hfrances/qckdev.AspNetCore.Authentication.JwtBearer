services:
  api:
    build:
      context: ../..
      dockerfile: examples/JwtBearerExample.MultipleSchemes/Dockerfile
    container_name: jwt-multiple-schemes-api
    ports:
      - "5221:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: jwt-multiple-schemes-nginx
    depends_on:
      - api
    ports:
      - "5220:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
